<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publisher desk — STARTS JOURNEY</title><link rel="stylesheet" href="/styles.css"></head><body><header class="shell"><div class="masthead"><a class="brand" href="/">STARTS<span>.</span></a><div class="tagline">Publisher desk</div></div></header><main class="shell admin"><div class="section-head"><h2>Publisher desk</h2><span class="meta">Create, moderate, and keep the signal clear.</span></div><div class="admin-grid"><section class="panel"><h2>New story</h2><form id="composer"><label class="field">Headline<input name="title" required placeholder="Give it a point of view"></label><label class="field">Description<textarea name="description" rows="4" required></textarea></label><label class="field">Category<select name="category"><option>IDEAS</option><option>CULTURE</option><option>SPORTS</option><option>CITIES</option></select></label><label class="field">Image URL<input name="image" placeholder="https://..."></label><button class="button">PUBLISH STORY</button></form><h2 style="margin-top:36px">Ticker</h2><form id="tickerForm" class="field"><input name="ticker"><button class="button">UPDATE TICKER</button></form></section><section class="panel"><h2>Published stories</h2><div id="queue" class="queue">Loading...</div></section></div></main><script>const q=s=>document.querySelector(s);async function refresh(){const d=await fetch('/api/content').then(r=>r.json());q('#queue').innerHTML=d.articles.map(a=>'<div class="queue-item"><strong>'+a.title+'</strong><div class="meta">'+a.category+' · '+a.source+'</div><button class="button" onclick="removeStory(\''+a.id+'\')">REMOVE</button></div>').join('');q('#tickerForm input').value=d.ticker||''}async function removeStory(id){await fetch('/api/articles/'+id,{method:'DELETE'});refresh()}q('#composer').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));await fetch('/api/articles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();refresh()};q('#tickerForm').onsubmit=async e=>{e.preventDefault();await fetch('/api/ticker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker:e.target.ticker.value})});refresh()};refresh()</script></body></html>
