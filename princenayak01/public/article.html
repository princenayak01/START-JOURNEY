<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story — STARTS JOURNEY</title><link rel="stylesheet" href="/styles.css"></head><body><div id="progress" class="progress"></div><header class="shell"><div class="masthead"><a class="brand" href="/">STARTS<span>.</span></a><a class="button" href="/">BACK TO HOME</a></div></header><main id="article" class="shell article"><div class="empty">Loading story...</div></main><script>const id=decodeURIComponent(location.pathname.split('/').pop());fetch('/api/content').then(r=>r.json()).then(d=>{const a=d.articles.find(x=>x.id===id);if(!a)return;document.title=a.title+' — STARTS JOURNEY';document.querySelector('#article').innerHTML='<div class="kicker">'+a.category+'</div><h1>'+a.title+'</h1><div class="meta">By '+(a.author||a.source)+' · '+(a.readTime||'4 min read')+'</div><img src="'+a.image+'" alt=""><p class="lead">'+a.description+'</p><p>There is a story behind every shift. We follow the people, ideas and places making a difference, with room for nuance and a little wonder. This is a thoughtful beginning to a much larger conversation.</p><p>Stay with us as the journey unfolds. Share this story with someone who is curious about what comes next.</p>'});addEventListener('scroll',()=>{const h=document.documentElement;document.querySelector('#progress').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%'})</script></body></html>
