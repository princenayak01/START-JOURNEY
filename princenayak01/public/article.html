<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story — STARTS JOURNEY</title><link rel="stylesheet" href="/styles.css"></head><body><div id="progress" class="progress"></div><header class="shell"><div class="masthead"><a class="brand" href="/">STARTS<span>.</span></a><a class="button" href="/">BACK TO HOME</a></div></header><main id="article" class="shell article"><div class="empty">Loading story...</div></main><script>const id=decodeURIComponent(location.pathname.split('/').pop());const hero='https://hebbkx1anhila5yf.public.blob.vercel-storage.com/WhatsApp%20Image%202026-09-15%20at%209.21.19%20AM-W2VRxOsBwt5HVefVfvZVmAyKF0g92A.jpeg';const gallery=['https://hebbkx1anhila5yf.public.blob.vercel-storage.com/WhatsApp%20Image%202026-09-15%20at%209.21.26%20AM-iMWUILgstmotmVzJBLHCKTWOae8K7w.jpeg','https://hebbkx1anhila5yf.public.blob.vercel-storage.com/WhatsApp%20Image%202026-09-15%20at%209.21.32%20AM-OSZjqR3FePK5YKaoiBexLDhx6lhMlb.jpeg','https://hebbkx1anhila5yf.public.blob.vercel-storage.com/WhatsApp%20Image%202026-09-15%20at%209.21.42%20AM-YmfzbvxNg0BgFcITMgHsxWVpe7yW47.jpeg'];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));fetch('/api/content').then(r=>r.json()).then(d=>{const a=d.articles.find(x=>x.id===id);if(!a)return;document.title=a.title+' — STARTS JOURNEY';const isDemo=a.id==='satyam-yaduvanshi-journey';document.querySelector('#article').innerHTML=isDemo?`<div class="article-breadcrumb">Home <span>›</span> Public Figures <span>›</span> ${esc(a.title)}</div><div class="kicker">${esc(a.category)}</div><h1>${esc(a.title)}</h1><p class="lead">${esc(a.description)}</p><div class="article-author">By <strong>${esc(a.author)}</strong><span>${esc(a.publishedAt.slice(0,10))} · ${esc(a.readTime)}</span></div><img class="article-hero" src="${hero}" alt="Satyam Yaduvanshi relaxing outdoors"><aside class="article-pullquote">Satyam Yaduvanshi has built an organic community of over 600,000 followers on Instagram.</aside><details class="contents" open><summary>CONTENTS</summary><ol><li>Family Background And Early Roots</li><li>How Satyam Built His Audience From Scratch</li><li>Stepping Into Music Production</li><li>Brand Collaborations, Mindset, And Future Plans</li></ol></details><p><strong>Satyam Yaduvanshi</strong> is a 17-year-old Indian solo digital creator, lifestyle influencer, and music producer from a small village near Jhansi, Uttar Pradesh. Driven by fashion, travel, and cinematic visuals, he started with a basic smartphone and a clear desire to share his personal vibe with the online world.</p><img class="article-inline-image" src="${gallery[0]}" alt="Satyam Yaduvanshi in a patterned shirt"><h2>Family Background And Early Roots</h2><p>Growing up in a modest village home without industry connections or expensive equipment, he learned patience and honest effort from his parents. Instead of letting limited resources hold him back, he used his everyday surroundings as motivation to build an independent path through self-taught creative skills.</p><h2>How Satyam Yaduvanshi Built His Audience From Scratch</h2><p>His creative journey began with short-form videos and long hours of experimenting. When platforms changed, he rebuilt his audience from zero on Instagram, handling ideas, shooting angles, editing, and publishing as a solo creator.</p><img class="article-inline-image" src="${gallery[1]}" alt="Satyam Yaduvanshi portrait"><p>That consistency eventually turned into a community of over six lakh followers. His work shows that high-quality visual storytelling can come from any small town with the right vision.</p><h2>Stepping Into Music Production</h2><p>Alongside video content, Satyam entered music production by releasing original remix tracks online. His audio arrangements and upbeat rhythms added another dimension to his signature travel and styling videos.</p><img class="article-inline-image" src="${gallery[2]}" alt="Satyam Yaduvanshi lifestyle photo"><h2>Brand Collaborations, Mindset, And Future Plans</h2><p>His organic growth led to partnerships with fashion, hospitality, and emerging technology brands. His advice to young dreamers remains grounded: stay consistent, keep your eyes on the goal, and let your work speak for itself.</p><div class="article-share"><strong>SHARE THIS ARTICLE</strong><button onclick="navigator.share?.({title:document.title,url:location.href})">Share</button></div>`:`<div class="kicker">${esc(a.category)}</div><h1>${esc(a.title)}</h1><div class="meta">By ${esc(a.author||a.source)} · ${esc(a.readTime||'4 min read')}</div><img class="article-hero" src="${esc(a.image||hero)}" alt="${esc(a.title)}"><p class="lead">${esc(a.description)}</p><p>There is a story behind every shift. We follow the people, ideas and places making a difference, with room for nuance and a little wonder.</p>`;if(isDemo){const popup=document.createElement('div');popup.className='category-popup';popup.innerHTML='<button aria-label="Close topic popup">×</button><span>▣</span><strong>Acting &amp; Theater</strong><a href="/">⌃</a>';popup.querySelector('button').onclick=()=>popup.remove();document.body.append(popup)}});addEventListener('scroll',()=>{const h=document.documentElement;document.querySelector('#progress').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%'})</script></body></html>
